services:
  mariadb-master1:
    image: mariadb:latest
    container_name: mariadb_master1
    restart: unless-stopped
    volumes:
      - mariadb_master1_data:/var/lib/mysql
      - ./configs/master1.cnf:/etc/mysql/conf.d/replication.cnf
    environment:
      MYSQL_ROOT_PASSWORD: my-secret-pw
      MYSQL_DATABASE: mydatabase
    ports:
      - "3307:3306"
    networks:
      - mariadb_mm_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  mariadb-master2:
    image: mariadb:latest
    container_name: mariadb_master2
    restart: unless-stopped
    volumes:
      - mariadb_master2_data:/var/lib/mysql
      - ./configs/master2.cnf:/etc/mysql/conf.d/replication.cnf
    environment:
      MYSQL_ROOT_PASSWORD: my-secret-pw
      MYSQL_DATABASE: mydatabase
    ports:
      - "3308:3306"
    networks:
      - mariadb_mm_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mariadb_master1_data:
    name: mariadb_master1_data
    driver: local
  mariadb_master2_data:
    name: mariadb_master2_data
    driver: local

networks:
  mariadb_mm_network:
    name: mariadb_mm_network
    driver: bridge
