# =============================================================================
# Aerospike 3-DC Strong-Consistency Cluster - Docker Compose
# =============================================================================
#
# Topology:
#   DC1 (Active):
#     Rack 1: dc1-node1  172.28.1.11   ← all master partitions (active-rack=1)
#             dc1-node2  172.28.1.12
#             dc1-node3  172.28.1.13
#
#   DC2 (Standby):
#     Rack 2: dc2-node1  172.28.1.21   ← replica partitions only
#             dc2-node2  172.28.1.22
#             dc2-node3  172.28.1.23
#
#   DC3 (Tie-breaker):
#     Rack 3: dc3-node   172.28.1.31   ← quiesced, 0 partitions
#
# DC3 (quorum) lives alongside DC1 so DC1+DC3 always forms a majority (4/7
# >= min-cluster-size=4) even when DC2 is fully down.  If DC1 fails, DC2
# alone (3 nodes) < 4 → stops writes (no split-brain).
#
# Network: 172.28.1.0/24 (separate from as-multisite 172.28.0.0/24 so both
# topologies can run simultaneously on the same Docker host).
# SC mode: replication-factor=4, active-rack=1, min-cluster-size=4.
# Masters pinned to DC1 (Rack 1); dc3-node quiesced (pure tie-breaker).
#
# Usage:
#   docker compose -f docker-compose-3dc.yml up -d
#   TOPOLOGY=3dc ./scripts/validate-cluster.sh
#   TOPOLOGY=3dc ./scripts/simulate-failures.sh
#   python3 scripts/cluster-visualizer.py --topology 3dc
# =============================================================================

x-common-env: &common-env
  MESH_SEEDS: >-
    172.28.1.11:3002,172.28.1.12:3002,172.28.1.13:3002,172.28.1.21:3002,172.28.1.22:3002,172.28.1.23:3002,172.28.1.31:3002

x-common-healthcheck: &common-healthcheck
  test: ["CMD", "asinfo", "-v", "status", "-h", "127.0.0.1", "-p", "3000"]
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 30s

x-common-settings: &common-settings
  image: myubuntu-noble_aerospike-multisite
  restart: unless-stopped
  cap_add:
    - NET_ADMIN
  stdin_open: true
  tty: true
  command: ["asd"]
  healthcheck:
    <<: *common-healthcheck
  networks:
    - as-3dc

services:
  # ===========================================================================
  # DC1 / Rack 1  (3 nodes — active, all master partitions)
  # ===========================================================================
  dc1-node1:
    <<: *common-settings
    container_name: dc1-node1
    hostname: dc1-node1
    environment:
      <<: *common-env
      NODE_ID: A1
      RACK_ID: "1"
      SERVICE_ADDRESS: 172.28.1.11
    volumes:
      - dc1_node1_data:/etc/aerospike/data
      - dc1_node1_smd:/etc/aerospike/smd
      - dc1_node1_log:/etc/aerospike/log
    ports:
      - "4000:3000"   # service
      - "4001:3001"   # fabric
      - "4002:3002"   # heartbeat
      - "4003:3003"   # info
    networks:
      as-3dc:
        ipv4_address: 172.28.1.11

  dc1-node2:
    <<: *common-settings
    container_name: dc1-node2
    hostname: dc1-node2
    depends_on:
      dc1-node1:
        condition: service_started
    environment:
      <<: *common-env
      NODE_ID: A2
      RACK_ID: "1"
      SERVICE_ADDRESS: 172.28.1.12
    volumes:
      - dc1_node2_data:/etc/aerospike/data
      - dc1_node2_smd:/etc/aerospike/smd
      - dc1_node2_log:/etc/aerospike/log
    ports:
      - "4100:3000"
      - "4101:3001"
      - "4102:3002"
      - "4103:3003"
    networks:
      as-3dc:
        ipv4_address: 172.28.1.12

  dc1-node3:
    <<: *common-settings
    container_name: dc1-node3
    hostname: dc1-node3
    depends_on:
      dc1-node1:
        condition: service_started
    environment:
      <<: *common-env
      NODE_ID: A3
      RACK_ID: "1"
      SERVICE_ADDRESS: 172.28.1.13
    volumes:
      - dc1_node3_data:/etc/aerospike/data
      - dc1_node3_smd:/etc/aerospike/smd
      - dc1_node3_log:/etc/aerospike/log
    ports:
      - "4200:3000"
      - "4201:3001"
      - "4202:3002"
      - "4203:3003"
    networks:
      as-3dc:
        ipv4_address: 172.28.1.13

  # ===========================================================================
  # DC2 / Rack 2  (3 nodes — standby, replica partitions only)
  # ===========================================================================
  dc2-node1:
    <<: *common-settings
    container_name: dc2-node1
    hostname: dc2-node1
    depends_on:
      dc1-node1:
        condition: service_started
    environment:
      <<: *common-env
      NODE_ID: B1
      RACK_ID: "2"
      SERVICE_ADDRESS: 172.28.1.21
    volumes:
      - dc2_node1_data:/etc/aerospike/data
      - dc2_node1_smd:/etc/aerospike/smd
      - dc2_node1_log:/etc/aerospike/log
    ports:
      - "4300:3000"
      - "4301:3001"
      - "4302:3002"
      - "4303:3003"
    networks:
      as-3dc:
        ipv4_address: 172.28.1.21

  dc2-node2:
    <<: *common-settings
    container_name: dc2-node2
    hostname: dc2-node2
    depends_on:
      dc2-node1:
        condition: service_started
    environment:
      <<: *common-env
      NODE_ID: B2
      RACK_ID: "2"
      SERVICE_ADDRESS: 172.28.1.22
    volumes:
      - dc2_node2_data:/etc/aerospike/data
      - dc2_node2_smd:/etc/aerospike/smd
      - dc2_node2_log:/etc/aerospike/log
    ports:
      - "4400:3000"
      - "4401:3001"
      - "4402:3002"
      - "4403:3003"
    networks:
      as-3dc:
        ipv4_address: 172.28.1.22

  dc2-node3:
    <<: *common-settings
    container_name: dc2-node3
    hostname: dc2-node3
    depends_on:
      dc2-node1:
        condition: service_started
    environment:
      <<: *common-env
      NODE_ID: B3
      RACK_ID: "2"
      SERVICE_ADDRESS: 172.28.1.23
    volumes:
      - dc2_node3_data:/etc/aerospike/data
      - dc2_node3_smd:/etc/aerospike/smd
      - dc2_node3_log:/etc/aerospike/log
    ports:
      - "4500:3000"
      - "4501:3001"
      - "4502:3002"
      - "4503:3003"
    networks:
      as-3dc:
        ipv4_address: 172.28.1.23

  # ===========================================================================
  # DC3 / Rack 3  (1 tie-breaker node — quiesced, holds 0 partitions)
  # ===========================================================================
  dc3-node:
    <<: *common-settings
    container_name: dc3-node
    hostname: dc3-node
    depends_on:
      dc1-node1:
        condition: service_started
      dc2-node1:
        condition: service_started
    environment:
      <<: *common-env
      NODE_ID: C1
      RACK_ID: "3"
      SERVICE_ADDRESS: 172.28.1.31
      AUTO_QUIESCE: "true"
      AEROSPIKE_NAMESPACE: mynamespace
    volumes:
      - dc3_node_data:/etc/aerospike/data
      - dc3_node_smd:/etc/aerospike/smd
      - dc3_node_log:/etc/aerospike/log
    ports:
      - "4600:3000"
      - "4601:3001"
      - "4602:3002"
      - "4603:3003"
    networks:
      as-3dc:
        ipv4_address: 172.28.1.31

# =============================================================================
# Volumes — prefixed 3dc_ to avoid collision with ms_ (2-site) volumes
# =============================================================================
volumes:
  dc1_node1_data:
    name: 3dc_dc1_node1_data
  dc1_node1_smd:
    name: 3dc_dc1_node1_smd
  dc1_node1_log:
    name: 3dc_dc1_node1_log
  dc1_node2_data:
    name: 3dc_dc1_node2_data
  dc1_node2_smd:
    name: 3dc_dc1_node2_smd
  dc1_node2_log:
    name: 3dc_dc1_node2_log
  dc1_node3_data:
    name: 3dc_dc1_node3_data
  dc1_node3_smd:
    name: 3dc_dc1_node3_smd
  dc1_node3_log:
    name: 3dc_dc1_node3_log
  dc2_node1_data:
    name: 3dc_dc2_node1_data
  dc2_node1_smd:
    name: 3dc_dc2_node1_smd
  dc2_node1_log:
    name: 3dc_dc2_node1_log
  dc2_node2_data:
    name: 3dc_dc2_node2_data
  dc2_node2_smd:
    name: 3dc_dc2_node2_smd
  dc2_node2_log:
    name: 3dc_dc2_node2_log
  dc2_node3_data:
    name: 3dc_dc2_node3_data
  dc2_node3_smd:
    name: 3dc_dc2_node3_smd
  dc2_node3_log:
    name: 3dc_dc2_node3_log
  dc3_node_data:
    name: 3dc_dc3_node_data
  dc3_node_smd:
    name: 3dc_dc3_node_smd
  dc3_node_log:
    name: 3dc_dc3_node_log

# =============================================================================
# Network — separate subnet from as-multisite so both topologies coexist
# =============================================================================
networks:
  as-3dc:
    name: as-3dc
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.1.0/24
          gateway: 172.28.1.1
